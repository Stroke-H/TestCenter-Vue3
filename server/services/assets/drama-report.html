<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Heading}} · TestCenter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#263447;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}a{color:#3f6ec9;text-decoration:none}a:hover{text-decoration:underline}main{max-width:1380px;margin:0 auto;padding:32px 28px 24px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;color:#7d8da7;letter-spacing:1.5px;font-weight:600}h1{font-size:26px;letter-spacing:-.5px;margin:5px 0 8px;font-weight:650}header p{margin:0;color:#7a8799;font-size:13px}.status{border:1px solid #dfe6f0;background:#fff;border-radius:9px;padding:7px 12px;color:#66768c;font-size:12px;white-space:nowrap}.status.warn{color:#a46723;background:#fff8ed;border-color:#f0dfc3}.status.error{color:#bd4848;background:#fff1f1;border-color:#f0d4d4}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0 20px}.stat{background:#fff;border:1px solid #e3e8f1;border-radius:13px;padding:17px 20px}.stat-label{font-size:12px;color:#7a899e}.stat-value{font-size:27px;font-weight:650;margin:2px 0}.stat-note{font-size:12px;color:#92a0b2}.notice{padding:11px 15px;border:1px solid #e0e8f7;border-radius:10px;background:#f0f5ff;color:#5c7195;font-size:12px;margin-bottom:16px}.notice.error{background:#fff4ee;border-color:#f4dccc;color:#ad622f}.panel{background:#fff;border:1px solid #e1e7f0;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #20335403}.panel-top{padding:19px 20px 14px;border-bottom:1px solid #e8edf4}.topline{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h2{font-size:16px;margin:0;font-weight:650}.hint{font-size:12px;color:#8c98a9}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.filter{padding:6px 11px;background:#f5f7fa;color:#697a91;border:1px solid transparent;border-radius:7px;font-size:12px}.filter[aria-pressed=true]{color:#3f65af;background:#edf3ff;border-color:#d6e2fa}.filter span{margin-left:5px;font-variant-numeric:tabular-nums;opacity:.8}.tools{display:flex;gap:10px;align-items:center;margin-top:16px}input{padding:9px 12px;border:1px solid #e0e6ef;border-radius:8px;max-width:460px;width:100%;background:#fbfcfe;min-width:0}input:focus{border-color:#7e9bcd;background:#fff}.btn{padding:8px 12px;border-radius:8px;border:1px solid #dfe6ef;background:#fff;color:#536b8c;white-space:nowrap}.btn.primary{background:#edf3ff;color:#426cb3;border-color:#d9e5fa}select{border:1px solid #e1e7ef;padding:6px 9px;border-radius:7px;color:#65738a;background:#fff}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}col.identity{width:33%}col.findings{width:47%}col.mark{width:12%}col.operation{width:8%}thead{background:#f8fafd}th{padding:12px 20px;color:#8795a9;text-align:left;font-size:11px;font-weight:600;letter-spacing:.5px;border-bottom:1px solid #e9edf4}td{padding:15px 20px;border-bottom:1px solid #edf1f6;vertical-align:top}tbody tr:last-child td{border-bottom:none}.name{font-weight:600;color:#354b68;overflow-wrap:anywhere}.cn{color:#6c7d94;font-size:12px;margin-top:4px;overflow-wrap:anywhere}.id{font-size:11px;color:#99a5b5;margin-top:5px;overflow-wrap:anywhere}.preview{font-size:12px;color:#66768a;overflow-wrap:anywhere;margin:0 0 5px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{font-size:10px;color:#778ba8;border:1px solid #e5ebf4;background:#fafbfd;border-radius:5px;padding:1px 6px}.mark-label{font-size:12px;color:#95a2b4}.mark-label.selected{color:#a47b31}.link-btn{background:none;border:0;color:#537cc2;padding:0;font-size:12px}.more{margin-top:8px}.pager{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid #e8edf4;color:#8390a2;font-size:12px}.pager-right{display:flex;gap:10px;align-items:center}.empty{padding:50px 20px;text-align:center;color:#93a0b2}.empty button{margin-top:14px}footer{font-size:11px;color:#98a4b4;padding:15px 3px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}#message{min-height:20px;color:#a06a35;font-size:12px;margin-top:9px}.menu{position:fixed;z-index:20;width:225px;padding:5px;background:#fff;border:1px solid #e0e7f2;border-radius:10px;box-shadow:0 9px 35px #21334f24}.menu button{display:block;width:100%;border:0;border-radius:6px;padding:10px;text-align:left;background:#fff;color:#4e6482;font-size:12px}.menu button:hover{background:#f3f6fc}.menu small{display:block;color:#9ba5b5;font-size:10px;margin-top:2px}[hidden]{display:none!important}dialog{border:1px solid #dfe7f1;border-radius:16px;padding:0;width:min(850px,calc(100vw - 36px));max-height:85vh;box-shadow:0 25px 90px #162b4f2e;color:#344b67}dialog::backdrop{background:#172a4655;backdrop-filter:blur(3px)}.dialog-head{padding:21px 25px 17px;border-bottom:1px solid #e6ebf2;display:flex;gap:20px;justify-content:space-between;align-items:flex-start}.dialog-head h2{overflow-wrap:anywhere}.dialog-body{padding:20px 25px;max-height:61vh;overflow:auto}.dialog-body p,.dialog-body pre{font:inherit;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 13px;padding:12px 14px;background:#f7f9fc;border:1px solid #e6ecf4;border-radius:8px}.dialog-foot{border-top:1px solid #e6ebf2;padding:13px 25px;display:flex;justify-content:space-between;gap:10px;align-items:center}.close{border:0;background:transparent;font-size:22px;color:#8694a8;padding:0 2px;line-height:1}.dialog-meta{color:#91a0b1;font-size:12px;margin-top:7px}.full-note{margin:0 0 12px;font-size:12px;color:#94a1b2}
@media(max-width:760px){main{padding:22px 14px}header{flex-wrap:wrap}h1{font-size:22px}.stats{gap:8px;margin-top:19px}.stat{padding:12px}.stat-value{font-size:22px}.stat-note{display:none}.panel-top{padding:15px 13px}td,th{padding:12px}.table-scroll table{min-width:750px}.tools input{max-width:none}.pager{padding:12px}.hint{display:none}.dialog-head,.dialog-body,.dialog-foot{padding-left:17px;padding-right:17px}}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:first-child{grid-column:1/-1}.stat-value{font-size:21px}header p{overflow-wrap:anywhere}}
</style></head>
<body><main id="report" data-run-id="{{.RunID}}" data-category="{{.Category}}">
<header><div><div class="eyebrow">TESTCENTER / DRAMA INSPECTION</div><h1>{{.Heading}}</h1><p id="run-meta">正在读取报告摘要…</p></div><span id="run-status" class="status" role="status">加载中</span></header>
<div class="stats"><div class="stat"><div class="stat-label">首轮检测覆盖</div><div id="coverage-value" class="stat-value">—</div><div id="coverage-note" class="stat-note">以实际完成名单为准</div></div><div class="stat"><div class="stat-label">异常剧集（去重）</div><div id="failure-value" class="stat-value">—</div><div class="stat-note">包含初检及二次确认后的最终异常</div></div><div class="stat"><div class="stat-label">执行耗时</div><div id="duration-value" class="stat-value">—</div><div id="retry-note" class="stat-note">正在读取复验覆盖情况</div></div></div>
<div id="coverage-warning" class="notice" hidden></div>
<section class="panel"><div class="panel-top"><div class="topline"><h2>异常明细</h2><span class="hint">每页按需加载，完整证据点击查看</span></div><nav id="filters" class="filters" aria-label="异常分类"></nav><div class="tools"><input id="search" type="search" maxlength="200" placeholder="搜索剧集名称、编号或错误内容" aria-label="搜索异常"><button id="refresh" class="btn" type="button">刷新</button></div></div>
<div class="table-scroll"><table><colgroup><col class="identity"><col class="findings"><col class="mark"><col class="operation"></colgroup><thead><tr><th>剧集信息</th><th>异常摘要</th><th>处理标记</th><th>OPERATING</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="empty" class="empty" role="status">正在加载当前页…</div>
<div class="pager"><span id="page-info">—</span><div class="pager-right"><select id="page-size" aria-label="每页条数"><option value="50">50 条 / 页</option><option value="100">100 条 / 页</option></select><button id="previous" class="btn" type="button" disabled>上一页</button><span id="page-index">1 / 1</span><button id="next" class="btn" type="button" disabled>下一页</button></div></div></section>
<div id="message" role="status" aria-live="polite"></div>
<footer><span>各分类数量可重复，同一剧集可能涉及多类异常。暂时忽略仅影响飞书重复提醒，不删除报告记录。</span><a id="original" href="#" download="drama-report.html">下载原始归档（HTML）</a></footer>
</main>
<div id="mark-menu" class="menu" role="menu" hidden><button type="button" data-action="data_issue" role="menuitem">数据问题<small>仅添加标记，仍正常上报</small></button><button type="button" data-action="temporarily_ignored" role="menuitem">暂时忽略<small>剧集及完整异常细节相同时不再提醒</small></button></div>
<dialog id="detail"><div class="dialog-head"><div><h2 id="detail-title">异常详情</h2><div id="detail-meta" class="dialog-meta"></div></div><button id="detail-close" class="close" type="button" aria-label="关闭详情">×</button></div><div id="detail-body" class="dialog-body"></div><div class="dialog-foot"><span class="hint">显示归档原文，不重新请求运营后台。</span><a id="drama-link" class="btn primary" target="_blank" rel="noopener noreferrer">查看剧集信息</a></div></dialog>
<script>
(function(){'use strict';
const root=document.getElementById('report'), runId=root.dataset.runId, base='/api/test-runs/'+encodeURIComponent(runId), $=id=>document.getElementById(id);
const categories=[['all','全部异常'],['rules','四类规则异常'],['playback','播放'],['group','分组'],['classification','分类'],['language','语种'],['copyright','版权'],['free','免费集数'],['other','其他'],['review','语种待复核']];
const labels=Object.fromEntries(categories),actions={data_issue:'数据问题',temporarily_ignored:'暂时忽略'};
const url=new URL(location.href); let category=url.searchParams.get('category')||root.dataset.category;if(!labels[category])category=root.dataset.category;
let page=1,pages=1,size=50,requestNumber=0,controller=null,timer=null,currentRows=new Map(),menuId=null,detailNumber=0;
$('search').value=url.searchParams.get('q')||'';
$('original').href=base+'/artifacts/report?view=original&download=1';
function node(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
function notify(text){$('message').textContent=text||'';}
function closeMenu(){$('mark-menu').hidden=true;menuId=null;}
function validLink(value){try{const u=new URL(value,location.origin);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function countFor(summary,key){if(key==='all')return summary.total;if(key==='rules')return summary.ruleTotal;if(key==='review')return summary.reviewCount;return summary.categories[key]||0;}
function renderSummary(s){
 $('run-meta').textContent=s.startedAt+' 至 '+s.finishedAt+' · '+runId;$('failure-value').textContent=Number(s.total).toLocaleString();$('duration-value').textContent=s.duration||'—';
 const initial=s.coverage.find(c=>c.phase==='initial'),retry=s.coverage.find(c=>c.phase==='retry');
 $('coverage-value').textContent=initial?initial.completed.toLocaleString()+' / '+initial.expected.toLocaleString():'未记录';
 $('coverage-note').textContent=initial?(initial.complete?'覆盖完整':'未完成 '+initial.missing+' 部'):'历史报告未记录完成名单，不推定完整';
 $('retry-note').textContent=retry?'复验完成 '+retry.completed+' / '+retry.expected:'本报告无复验覆盖记录';
 const successful=['passed','done','success'].includes(String(s.status).toLowerCase()),incomplete=s.coverage.some(c=>!c.complete);
 $('run-status').textContent=!successful?'执行未成功':incomplete?'检测不完整':s.total?'检测完成，发现异常':'检测完成，未发现明确异常';$('run-status').className='status'+(!successful||incomplete?' error':s.total?' warn':'');
 $('coverage-warning').hidden=!incomplete;if(incomplete){$('coverage-warning').className='notice error';$('coverage-warning').textContent='本次存在未完成项，当前异常明细不能代表全部剧集的最终结论。';}
 const filters=$('filters');filters.replaceChildren();categories.forEach(([key,label])=>{const button=node('button',label,'filter');button.type='button';button.dataset.category=key;button.setAttribute('aria-pressed',String(category===key));button.append(node('span',countFor(s,key)));filters.append(button);});
}
function renderRows(items,markingAvailable){
 currentRows=new Map(items.map(item=>[item.id,item]));const body=$('rows');body.replaceChildren();
 items.forEach(item=>{const tr=node('tr');tr.dataset.id=item.id;const identity=node('td');identity.append(node('div',(item.intId?item.intId+' · ':'')+(item.title||item.cnTitle||'未记录剧名'),'name'));if(item.cnTitle)identity.append(node('div',item.cnTitle,'cn'));identity.append(node('div',item.dramaId,'id'));
 const findings=node('td');item.preview.forEach(line=>findings.append(node('p',line,'preview')));const tags=node('div',undefined,'badges');item.categories.forEach(key=>tags.append(node('span',labels[key]||key,'badge')));findings.append(tags);const more=node('button','查看完整详情（'+item.errorCount+' 项）','link-btn more');more.type='button';more.dataset.open=item.id;findings.append(more);
 const mark=node('td');mark.append(node('span',actions[item.action]||(item.canMark?'未标记':'待人工复核'),'mark-label'+(item.action?' selected':'')));
 const operation=node('td');if(item.canMark){const trigger=node('button','标记 ▾','link-btn');trigger.type='button';trigger.dataset.mark=item.id;trigger.setAttribute('aria-haspopup','menu');trigger.disabled=!markingAvailable;operation.append(trigger);}else{operation.append(node('span','—','mark-label'));}
 tr.append(identity,findings,mark,operation);body.append(tr);});
 $('empty').hidden=items.length>0;$('empty').textContent=items.length?'':'没有符合筛选条件的异常';
}
async function loadPage(){
 closeMenu();const serial=++requestNumber;if(controller)controller.abort();controller=new AbortController();const ownController=controller;
 $('rows').replaceChildren();$('empty').hidden=false;$('empty').textContent='正在加载当前页…';$('previous').disabled=true;$('next').disabled=true;
 const query=new URLSearchParams({category,page:String(page),pageSize:String(size),q:$('search').value.trim()});
 const timeout=setTimeout(()=>ownController.abort(),20000);
 try{const response=await fetch(base+'/report-data?'+query,{signal:ownController.signal,credentials:'same-origin'});const payload=await response.json();if(serial!==requestNumber)return;if(!response.ok)throw new Error(payload.error||'加载报告失败');page=payload.page;pages=payload.pages;renderSummary(payload.summary);renderRows(payload.items,payload.markingAvailable);$('page-info').textContent='筛选结果 '+payload.total.toLocaleString()+' 部 · 每页 '+size+' 条';$('page-index').textContent=page+' / '+pages;$('previous').disabled=page<=1;$('next').disabled=page>=pages;notify(payload.markingAvailable?'':'处理标记暂不可用，异常数据仍可查看。');const state=new URL(location.href);state.searchParams.set('category',category);if($('search').value.trim())state.searchParams.set('q',$('search').value.trim());else state.searchParams.delete('q');history.replaceState(null,'',state);}
 catch(error){if(serial!==requestNumber)return;$('empty').textContent=error.name==='AbortError'?'加载超时，请点击刷新重试。':error.message;notify('报告尚未加载成功，不能按零异常解读。');}
 finally{clearTimeout(timeout);}
}
async function getDetail(id){const response=await fetch(base+'/report-data/'+encodeURIComponent(id),{credentials:'same-origin'});const data=await response.json();if(!response.ok)throw new Error(data.error||'读取详情失败');return data;}
async function showDetail(id){
 const serial=++detailNumber;$('detail-title').textContent='异常详情';$('detail-meta').textContent='';$('detail-body').replaceChildren(node('p','正在读取完整证据…'));$('drama-link').hidden=true;if(!$('detail').open)$('detail').showModal();
 try{const data=await getDetail(id);if(serial!==detailNumber||!$('detail').open)return;$('detail-title').textContent=(data.intId?data.intId+' · ':'')+(data.cnTitle||data.title||'异常详情');$('detail-meta').textContent=data.dramaId;const body=$('detail-body');body.replaceChildren();body.append(node('div',data.canMark?'处理标记作用于该剧本次完整异常集合；细节变化不会沿用忽略。':'本项为待人工复核记录，不计为明确异常，也不自动上报。','full-note'));data.errors.forEach(line=>body.append(node('p',line)));if(data.description){body.append(node('h3','完整简介'));body.append(node('pre',data.description));}const href=validLink(data.dramaURL);if(href){$('drama-link').href=href;$('drama-link').hidden=false;}}
 catch(error){if(serial===detailNumber&&$('detail').open)$('detail-body').replaceChildren(node('p',error.message));}
}
$('rows').addEventListener('click',event=>{const open=event.target.closest('[data-open]');if(open){showDetail(open.dataset.open);return;}const mark=event.target.closest('[data-mark]');if(!mark)return;const id=mark.dataset.mark;if(menuId===id){closeMenu();return;}const rect=mark.getBoundingClientRect();menuId=id;const menu=$('mark-menu');menu.hidden=false;menu.style.left=Math.max(8,Math.min(rect.right-menu.offsetWidth,innerWidth-menu.offsetWidth-8))+'px';menu.style.top=(rect.bottom+menu.offsetHeight+8>innerHeight?Math.max(8,rect.top-menu.offsetHeight-6):rect.bottom+6)+'px';event.stopPropagation();});
$('mark-menu').addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button||!menuId)return;const id=menuId,action=button.dataset.action;closeMenu();notify('正在保存标记…');try{const detail=await getDetail(id);if(!detail.canMark)throw new Error('该项不支持标记');const response=await fetch(base+'/issue-dispositions',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({dramaId:detail.dramaId,errors:detail.errors,action})});const result=await response.json();if(response.status===401)throw new Error('请先登录平台，再保存处理标记。');if(!response.ok)throw new Error(result.error||'标记保存失败');await loadPage();notify('已标记为'+actions[action]+'。');}catch(error){notify(error.message);}});
document.addEventListener('click',event=>{if(!$('mark-menu').contains(event.target))closeMenu();});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();});addEventListener('resize',closeMenu);addEventListener('scroll',closeMenu,true);
$('filters').addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;category=button.dataset.category;page=1;loadPage();});$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;loadPage();},250);});$('refresh').addEventListener('click',loadPage);$('previous').addEventListener('click',()=>{if(page>1){page--;loadPage();}});$('next').addEventListener('click',()=>{if(page<pages){page++;loadPage();}});$('page-size').addEventListener('change',()=>{size=Number($('page-size').value);page=1;loadPage();});$('detail-close').addEventListener('click',()=>{$('detail').close();detailNumber++;});$('detail').addEventListener('close',()=>{detailNumber++;});
loadPage();
})();
</script></body></html>
